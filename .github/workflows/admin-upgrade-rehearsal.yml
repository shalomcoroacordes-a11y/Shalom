name: SHALOM Admin upgrade rehearsal (no publishing)
on:
  pull_request:
    paths:
      - "admin-mobile/**"
      - ".github/workflows/admin-upgrade-rehearsal.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  BASELINE_VERSION: "0.1.7"
  BASELINE_CODE: "8"
  CANDIDATE_CODE: "9"
concurrency:
  group: shalom-admin-upgrade-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: admin-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject outdated source before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "${{ github.workspace }}/scripts/release-base-guard.cjs"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-node22-admin-mobile-${{ hashFiles('admin-mobile/package.json', 'admin-mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-node22-admin-mobile-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore Gradle dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-deps-jdk17-admin-mobile-${{ hashFiles('admin-mobile/package.json', 'admin-mobile/package-lock.json', 'admin-mobile/app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-jdk17-admin-mobile-
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install APK inspection tools
        run: sdkmanager --install "build-tools;35.0.0"
      - name: Install and test candidate code
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
          npm run test:syntax
          npm test
      - name: Generate original SHALOM icons and verify baseline
        run: |
          python3 -m venv /tmp/shalom-upgrade-icons
          /tmp/shalom-upgrade-icons/bin/pip install --disable-pip-version-check --quiet cairosvg
          /tmp/shalom-upgrade-icons/bin/python ../mobile/scripts/generate_icons.py
          mkdir -p assets
          cp ../mobile/assets/icon.png assets/icon.png
          cp ../mobile/assets/adaptive-foreground.png assets/adaptive-foreground.png
      - name: Verify candidate v0.1.8 and versionCode 9
        run: node ../scripts/verify-native-lock.cjs .
      - name: Generate official-package Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build release candidate without publishing
        working-directory: admin-mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Download actual official v0.1.7 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shalom-upgrade"
          gh release download admin-v0.1.7 --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHALOM-Admin-v0.1.7.apk' --dir "$RUNNER_TEMP/shalom-upgrade"
          test -s "$RUNNER_TEMP/shalom-upgrade/SHALOM-Admin-v0.1.7.apk"
      - name: REQUIRE matching real certificate, package and versionCode
        run: bash scripts/verify-upgrade-candidate.sh
      - name: Preserve VERIFIED rehearsal candidate as temporary artifact only
        uses: actions/upload-artifact@v4
        with:
          name: SHALOM-ADMIN-UPGRADE-TEST-0.1.8-${{ github.sha }}
          path: admin-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable hardware acceleration for Android emulator
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::GitHub runner does not expose /dev/kvm. Cannot claim emulator coverage." >&2
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
      - name: Rehearse 0.1.7 to 0.1.8 on emulator with adb install -r
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          disable-linux-hw-accel: false
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: bash admin-mobile/scripts/verify-upgrade-on-emulator.sh
      - name: Preserve emulator UI screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHALOM-ADMIN-0.1.8-UI-${{ github.sha }}
          path: ${{ runner.temp }}/shalom-upgrade/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
