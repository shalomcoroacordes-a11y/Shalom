name: SHALOM official base guard
on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  base:
    name: Official base guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression tests for release guard
        run: node tests/release-base-guard.cjs
      - name: Require current public APK, Admin APK and deployed web commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-base-guard.cjs
