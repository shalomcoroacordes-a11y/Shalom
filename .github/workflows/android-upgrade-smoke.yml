name: SHALOM Android 0.4.12 in-place smoke (verified CI artifact)
on:
  pull_request:
    paths:
      - "mobile/scripts/verify-upgrade-on-emulator.sh"
      - ".github/workflows/android-upgrade-smoke.yml"
permissions:
  contents: read
  actions: read
jobs:
  verify-existing-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install package metadata verification
        run: sdkmanager --install "build-tools;35.0.0"
      - name: Recover previous 0.4.12 CI candidate and historical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/shalom-candidate /tmp/shalom-baseline mobile/android/app/build/outputs/apk/release
          # Exact 0.4.12 artifact from SHA 5bc4e8c: compiled, signature verified.
          gh run download 44791713903 --repo "$GITHUB_REPOSITORY" --dir /tmp/shalom-candidate \
            --name SHALOM-UPGRADE-TEST-0.4.12-311e36e8852a1a623c58bdb78802185deee87bc9
          gh release download android-v0.4.10 --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHALOM-Android-v0.4.10.apk' --dir /tmp/shalom-baseline
          cp /tmp/shalom-candidate/app-release.apk mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/shalom-upgrade"
          cp /tmp/shalom-baseline/SHALOM-Android-v0.4.10.apk "$RUNNER_TEMP/shalom-upgrade/"
          test -s mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$RUNNER_TEMP/shalom-upgrade/SHALOM-Android-v0.4.10.apk"
      - name: Verify actual candidate version, package and historical signature
        working-directory: mobile
        run: bash scripts/verify-upgrade-candidate.sh
      - name: Enable KVM for Android emulator
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
      - name: Open 0.4.12 after upgrade over 0.4.10 and inspect launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          profile: pixel_4
          script: bash mobile/scripts/verify-upgrade-on-emulator.sh
