name: Import verified SHALOM lock blobs (one-time transfer)
on:
  push:
    branches: [transfer/verified-native-lock-blobs]
    paths: ['.github/workflows/import-verified-lock-blobs.yml']
permissions:
  actions: read
  contents: write
jobs:
  transfer:
    if: github.repository == 'shalomcoroacordes-a11y/Shalom' && github.ref == 'refs/heads/transfer/verified-native-lock-blobs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact artifact bytes and create only immutable git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh api repos/shalomcoroacordes-a11y/Shalom/actions/artifacts/15053261938/zip > public.zip
          gh api repos/shalomcoroacordes-a11y/Shalom/actions/artifacts/15053102425/zip > admin.zip
          printf '%s\n' '915b77badefa4a8ff7c3b9fa8247e6e3975effcbf07ccb3d6ea917f7154e8f04  public.zip' '551c2e71c69d4f06f3fade547b7a1a22aeb6c1af3aaf0fd16dcc9e188fd8e552  admin.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile, hashlib, json, base64, subprocess
          entries = [
              ('public', 'mobile', '80505dd4470ac5e092b7138614f8015976194023518577486d369ae7294aa9d5', '52b15660d0ba73939210df90f97513aa5e8070594b8d7765e978786c0d068ac1'),
              ('admin', 'admin-mobile', '329446cf72ae3dd5249c589fdaa7b1097032d6cdf4a96e33f52e24401aa6ad04', '8d5b4ed8c998f0ef9a8a461a76651238df8cabcb3b0d7d42c40a0b083633d442'),
          ]
          repo = 'repos/shalomcoroacordes-a11y/Shalom'
          for name, app, expected, manifest_hash in entries:
              with zipfile.ZipFile(name + '.zip') as z:
                  raw = z.read('Shalom/Shalom/' + app + '/package-lock.json')
              assert hashlib.sha256(raw).hexdigest() == expected
              manifest = json.loads(subprocess.check_output(['gh','api',repo+'/contents/'+app+'/package.json?ref=89b378a7d0e6e16537cd2b14738d54ec5ed6d169']))
              assert hashlib.sha256(base64.b64decode(manifest['content'])).hexdigest() == manifest_hash
              payload = json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              result = json.loads(subprocess.check_output(['gh','api','--method','POST',repo+'/git/blobs','--input','-'], input=payload.encode()))
              actual = hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
              assert result['sha'] == actual
              print(app+'/package-lock.json blob '+actual)
          PY
