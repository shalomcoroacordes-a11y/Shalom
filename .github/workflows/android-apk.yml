name: SHALOM Android APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar APK comprobando versión y firma (solo main)"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
concurrency:
  group: shalom-android-apk
  cancel-in-progress: true
jobs:
  build-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo dependencies
        run: npx expo install --check
      - name: Create dove launcher icons from original SHALOM logo
        run: |
          python3 -m venv /tmp/shalom-icon-generator
          /tmp/shalom-icon-generator/bin/pip install --disable-pip-version-check --quiet cairosvg
          /tmp/shalom-icon-generator/bin/python scripts/generate_icons.py
          test -s assets/icon.png
          test -s assets/adaptive-foreground.png
      - name: Verify package, version, assets and Supabase identity
        run: node scripts/release-preflight.js
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
      - name: Upload SHALOM APK
        uses: actions/upload-artifact@v4
        with:
          name: SHALOM-Android-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Reject duplicate Android version tags
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "android-v${VERSION}" >/dev/null 2>&1; then
            echo "Ya existe esta versión. Incrementa versión y versionCode." >&2
            exit 1
          fi

      - name: Require a compatible Android update certificate
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$SIGNER"
          test -x "$SIGNER"
          test -s android/app/build/outputs/apk/release/app-release.apk
          mkdir -p /tmp/shalom-signature
          gh release download android-v0.4.10 --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHALOM-Android-v0.4.10.apk' --dir /tmp/shalom-signature
          test -s /tmp/shalom-signature/SHALOM-Android-v0.4.10.apk
          "$SIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            > /tmp/shalom-signature/new.txt
          "$SIGNER" verify --print-certs /tmp/shalom-signature/SHALOM-Android-v0.4.10.apk \
            > /tmp/shalom-signature/baseline.txt
          NEW_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/shalom-signature/new.txt | head -1)
          OLD_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/shalom-signature/baseline.txt | head -1)
          test -n "$NEW_SHA"
          test -n "$OLD_SHA"
          if [ "$NEW_SHA" != "$OLD_SHA" ]; then
            echo "Firma distinta a Android 0.4.10: publicación bloqueada para proteger datos locales." >&2
            exit 1
          fi

      - name: Publish direct APK download link
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="android-v${VERSION}"
          APK="SHALOM-Android-v${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --title "SHALOM Android v${VERSION} — versión de prueba" --notes "APK publicado manualmente tras comprobar versión y firma de actualización. Verifica en teléfono antes de compartir."

