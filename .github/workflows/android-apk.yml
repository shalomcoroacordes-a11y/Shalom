name: SHALOM Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
concurrency:
  group: shalom-android-apk
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo dependencies
        run: npx expo install --check
      - name: Create dove launcher icons from original SHALOM logo
        run: |
          python3 -m venv /tmp/shalom-icon-generator
          /tmp/shalom-icon-generator/bin/pip install --disable-pip-version-check --quiet cairosvg
          /tmp/shalom-icon-generator/bin/python scripts/generate_icons.py
          test -s assets/icon.png
          test -s assets/adaptive-foreground.png
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
      - name: Upload SHALOM APK
        uses: actions/upload-artifact@v4
        with:
          name: SHALOM-Android-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="android-v${VERSION}"
          APK="SHALOM-Android-v${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --prerelease --title "SHALOM Android v${VERSION} — versión de prueba" --notes "APK nativo para Android con guardado del cancionero dentro de la aplicación, sin depender de Chrome. Versión de prueba; valida la descarga y el modo avión antes de compartir."
          fi

