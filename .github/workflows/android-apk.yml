name: SHALOM Android APK
on:
  workflow_dispatch:
    inputs:
      publish_official:
        description: Confirmar publicación oficial de APK desde main
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: shalom-android-apk
  cancel-in-progress: true
env:
  BASELINE_VERSION: "0.4.22"
  BASELINE_CODE: "45"
  CANDIDATE_CODE: "47"
jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_official == true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo dependencies
        run: npx expo install --check
      - name: Create dove launcher icons from original SHALOM logo
        run: |
          python3 -m venv /tmp/shalom-icon-generator
          /tmp/shalom-icon-generator/bin/pip install --disable-pip-version-check --quiet cairosvg
          /tmp/shalom-icon-generator/bin/python scripts/generate_icons.py
          test -s assets/icon.png
          test -s assets/adaptive-foreground.png
      - name: Run release checks
        run: |
          npm run test:syntax
          npm test
          node scripts/release-preflight.js --publish
          sdkmanager --install "build-tools;35.0.0"
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
      - name: Verify update against existing official APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/shalom-upgrade"
          gh release download android-v0.4.22 --pattern "SHALOM-Android-v0.4.22.apk" --dir "$RUNNER_TEMP/shalom-upgrade"
          bash scripts/verify-upgrade-candidate.sh
      - name: Enable emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Test in-place update and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-linux-hw-accel: false
          script: bash mobile/scripts/verify-upgrade-on-emulator.sh
      - name: Upload SHALOM APK
        uses: actions/upload-artifact@v4
        with:
          name: SHALOM-Android-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="android-v${VERSION}"
          APK="SHALOM-Android-v${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::La versión ya existe. No se sobrescribe una APK publicada."
            exit 1
          else
            gh release create "$TAG" "$APK" --title "SHALOM Android v${VERSION}" --notes "Versión oficial con secciones independientes, copia musical completa, contexto de letra, subdivisiones ampliables y reproductor compacto con seguimiento opcional y pellizco para ajustar letra y acordes. Firma, actualización y arranque Android verificados en emulador."
          fi

