name: SHALOM isolated PostgreSQL Studio history
on:
  pull_request:
    paths:
      - 'sql/SHALOM_STUDIO_HISTORY.sql'
      - 'tests/sql/studio-history.sql'
      - '.github/workflows/studio-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: shalom_history_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d shalom_history_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify history in disposable database (no production credentials)
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: postgres
          PGPASSWORD: disposable-test-only
          PGDATABASE: shalom_history_test
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/studio-history.sql
