name: Public quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check clean architecture naming policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_clean_changes.py "$BASE_SHA" "$HEAD_SHA"

      - name: Test clean architecture guard
        run: python3 tests/clean-changes-regression.py

      - name: Test home search source rendering
        run: node tests/home-search-render-regression.cjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Generate maintenance audit (informational)
        shell: bash
        run: python3 scripts/maintenance_audit.py > /tmp/shalom-maintenance-audit.json || { cat /tmp/shalom-maintenance-audit.json; echo 'Review audit warnings; existing quality checks remain authoritative.'; }

      - name: Inventory HTML script and stylesheet dependencies
        run: python3 scripts/audit_html_dependencies.py > /tmp/shalom-html-inventory.md

      - name: Inventory JavaScript imports and require dependencies
        run: python3 scripts/audit_js_dependencies.py > /tmp/shalom-js-inventory.md

      - name: Check admin script dependency order
        run: python3 scripts/check_admin_script_chain.py

      - name: Test supported category types in admin editor
        run: node tests/category-editor-types-regression.cjs

      - name: Test category refresh lock and recovery
        run: node tests/category-refresh-lock-regression.cjs

      - name: Test concurrent category save protection
        run: node tests/category-concurrent-save-regression.cjs

      - name: Test duplicate category handling
        run: node tests/category-duplicate-regression.cjs

      - name: Test category parent hierarchy validation
        run: node tests/category-hierarchy-regression.cjs

      - name: Test category type normalization against Supabase constraint
        run: node tests/category-type-regression.cjs

      - name: Test guided Studio editor and scoped rhythm controls
        run: node tests/studio-guided-editor.cjs

      - name: Test section-specific tempo, pattern and transitions
        run: node tests/studio-sections.cjs

      - name: Test compact Studio sections and chord sequence
        run: node tests/studio-compact-sections.cjs

      - name: Test compact Studio admin editor
        run: node tests/studio-compact-admin.cjs

      - name: Test Studio pinch zoom and independent reading controls
        run: node tests/studio-pinch-zoom.cjs

      - name: Test compact musician view and optional lyric following
        run: node tests/studio-musician-follow.cjs

      - name: Test rhythm lyric context and non-destructive subdivisions
        run: node tests/studio-rhythm-context.cjs

      - name: Test isolated sections and complete rhythm copy
        run: node tests/studio-section-independence.cjs

      - name: Test persistent Studio save and publication status
        run: node tests/studio-save-state.cjs

      - name: Verify identical Studio bundles for both native apps
        run: node mobile/tests/studio-offline.test.js

      - name: Test Android catalog download timeout
        run: node tests/mobile-sync-timeout.cjs

      - name: Test offline refresh and Android accessibility contracts
        run: node tests/offline-mobile-regression.cjs

      - name: Test offline capo version controls and chord figures
        run: node tests/offline-capo-controls-regression.cjs

      - name: Test native SHALOM reader and private likes
        run: node tests/mobile-song-reader-regression.cjs

      - name: Test SHALOM repertoire layout, icons and real filters
        run: node tests/mobile-repertoire-ui-regression.cjs

      - name: Verify Android safe area and uniform secondary screen headers
        run: node tests/mobile-header-safe-area-regression.cjs

      - name: Verify consistent SHALOM library section design
        run: node tests/mobile-section-theme-regression.cjs

      - name: Verify Cantos-style medley and misa readers
        run: node tests/mobile-multi-reader-regression.cjs

      - name: Verify instant tone, compact layouts and SHALOM original dove
        run: node tests/mobile-tone-compact-logo-regression.cjs

      - name: Test backup import preflight and recovery notices
        run: node tests/backup-import-safety-regression.cjs

      - name: Test category deletion navigation
        run: node tests/category-delete-navigation-regression.cjs

      - name: Test admin deletion paths and error handling
        run: node tests/admin-delete-regression.cjs

      - name: Check admin diagnostic contract
        run: node tests/admin-diagnostic-contract.cjs

      - name: Test admin song form saving
        run: node tests/admin-save-regression.cjs

      - name: Verify legacy admin cleanup and active dependencies
        run: node tests/legacy-admin-cleanup-regression.cjs

      - name: Verify informational page CSS equivalence
        run: node tests/public-info-bundle-regression.cjs

      - name: Verify four public page CSS bundles and import order
        run: node tests/public-page-bundles-regression.cjs

      - name: Verify catalog CSS bundles and import ordering
        run: node tests/catalog-css-bundles-regression.cjs

      - name: Verify song detail CSS bundle against original files
        run: node tests/song-detail-bundle-regression.cjs

      - name: Verify consolidated admin CSS and cascade order
        run: node tests/admin-css-consolidation.cjs

      - name: Test artist biography rendering without fallback patch
        run: node tests/artist-description-regression.cjs

      - name: Test all admin section tabs
        run: node tests/admin-tabs-regression.cjs

      - name: Test explicit artist search lifecycle
        run: node tests/admin-artist-search-lifecycle.cjs

      - name: Test explicit artist profile lifecycle
        run: node tests/admin-artist-profile-lifecycle.cjs

      - name: Test explicit donations lifecycle
        run: node tests/admin-donations-lifecycle.cjs

      - name: Test explicit messages lifecycle
        run: node tests/admin-messages-lifecycle.cjs

      - name: Test explicit request page lifecycle
        run: node tests/admin-request-page-lifecycle.cjs

      - name: Test explicit maintenance lifecycle
        run: node tests/admin-maintenance-lifecycle.cjs

      - name: Test explicit home lifecycle
        run: node tests/admin-home-lifecycle.cjs

      - name: Test explicit public pages lifecycle
        run: node tests/admin-public-pages-lifecycle.cjs

      - name: Test explicit song versions lifecycle
        run: node tests/admin-song-versions-lifecycle.cjs

      - name: Test category descriptions at render source
        run: node tests/category-description-rendering.cjs

      - name: Test song feedback rendering
        run: node tests/song-feedback-rendering.cjs

      - name: Test direct song overview rendering
        run: node tests/song-overview-rendering.cjs

      - name: Test rehearsal and mass repertories
        run: node tests/repertoires-regression.cjs

      - name: Validate HTML and local assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import sys

          root = Path('.')
          failures = []
          optimized_pages = {
              'index.html', 'canciones.html', 'cancion.html', 'artistas.html',
              'artista.html', 'categorias.html', 'albumes.html', 'donaciones.html'
          }

          class PageParser(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.ids = set()
                  self.refs = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  element_id = values.get('id')
                  if element_id:
                      if element_id in self.ids:
                          failures.append(f'{self.path}: duplicate id {element_id!r}')
                      self.ids.add(element_id)

                  for key in ('src', 'href'):
                      value = values.get(key)
                      if value:
                          self.refs.append(value)

                  if tag == 'script' and values.get('src'):
                      self.scripts.append((values['src'], 'defer' in values))

          for page in sorted(root.glob('*.html')):
              parser = PageParser(page)
              parser.feed(page.read_text(encoding='utf-8'))

              for reference in parser.refs:
                  parsed = urlsplit(reference)
                  if parsed.scheme or reference.startswith('//') or reference.startswith('#'):
                      continue
                  local = parsed.path
                  if not local or local.endswith('/'):
                      continue
                  target = (page.parent / local).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      continue
                  if not target.exists():
                      failures.append(f'{page}: missing local asset {local!r}')

              if page.name not in optimized_pages:
                  continue

              script_names = [src.split('?', 1)[0] for src, _ in parser.scripts]
              try:
                  sdk_index = next(i for i, name in enumerate(script_names) if '@supabase/supabase-js' in name)
                  guard_index = script_names.index('supabase-cdn-guard.js') if 'supabase-cdn-guard.js' in script_names else None
                  client_index = script_names.index('Supabase.js')
              except (StopIteration, ValueError):
                  failures.append(f'{page}: incomplete Supabase script chain')
                  continue

              if sdk_index >= client_index:
                  failures.append(f'{page}: Supabase SDK must load before Supabase.js')
              if guard_index is not None and not (sdk_index < guard_index < client_index):
                  failures.append(f'{page}: Supabase guard must load between SDK and client')
              for index in (sdk_index, client_index):
                  if not parser.scripts[index][1]:
                      failures.append(f'{page}: Supabase scripts must use defer')

          if not Path('.nojekyll').exists():
              failures.append('Missing .nojekyll for static GitHub Pages publishing')

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Check required public entrypoints
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            index.html canciones.html cancion.html artistas.html artista.html \
            categorias.html albumes.html donaciones.html acerca.html \
            contacto.html solicitar-canto.html Supabase.js; do
            test -f "$file"
          done

      - name: Reject private Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          pattern='sb_secret_[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*='
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude='*.md' \
            "$pattern" .; then
            echo 'A private Supabase key appears to be committed.' >&2
            exit 1
          fi
