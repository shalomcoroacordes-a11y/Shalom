name: Publicar SHALOM 0.1.1 con paloma original
on:
  push:
    paths:
      - ".github/workflows/publish-shalom-icon.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que la compilación con nuevo icono terminó correctamente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run watch 43676615936 --repo "${{ github.repository }}" --exit-status
      - name: Descargar APK verificado desde la compilación con icono
        uses: actions/download-artifact@v4
        with:
          name: SHALOM-Android-APK
          path: apk
          run-id: 43676615936
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar enlace directo del APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s apk/app-release.apk
          mv apk/app-release.apk apk/SHALOM-Android-0.1.1.apk
          gh release create v0.1.1-paloma-shalom apk/SHALOM-Android-0.1.1.apk \
            --target "e2e91a55b8a5a6b2c88dbea2f7b03a912533e338" \
            --title "SHALOM Android 0.1.1 - Icono paloma original" \
            --prerelease \
            --notes "Versión de prueba con la paloma original del logo SHALOM como ícono Android y adaptive icon. Instala únicamente en dispositivos de confianza. Si Android no permite actualizar el APK de prueba anterior por diferencia de firma, desinstala la versión previa y después instala esta; desinstalar puede eliminar los cantos guardados localmente."
