name: Prepare Expo 58.1 dependency locks (review only)
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-expo-locks.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, admin-mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve only the required Expo packages
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PWD" == */admin-mobile ]]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund 'expo@~58.1.0' 'expo-crypto@~58.0.9'
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund 'expo@~58.1.0' 'expo-file-system@~58.0.15' 'expo-sharing@~58.0.24'
          fi
          git diff -- package.json package-lock.json > "$RUNNER_TEMP/expo-lock.patch"
          test -s "$RUNNER_TEMP/expo-lock.patch"
          printf '\n---BEGIN-EXPO-LOCK-PATCH---\n'
          cat "$RUNNER_TEMP/expo-lock.patch"
          printf '\n---END-EXPO-LOCK-PATCH---\n'
      - name: Test resolved lock and Expo compatibility
        working-directory: ${{ matrix.app }}
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run test:syntax
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-lock-${{ matrix.app }}
          path: |
            ${{ matrix.app }}/package.json
            ${{ matrix.app }}/package-lock.json
          retention-days: 3
