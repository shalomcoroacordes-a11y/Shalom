name: SHALOM Android certificate history (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-signature-audit.yml"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
jobs:
  signature-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install APK signing verifier
        run: sdkmanager --install "build-tools;35.0.0"
      - name: Download signed public baseline releases (no changes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/shalom-android-certificates
          gh release download android-v0.4.8 --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHALOM-Android-v0.4.8.apk' --dir /tmp/shalom-android-certificates
          gh release download android-v0.4.10 --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHALOM-Android-v0.4.10.apk' --dir /tmp/shalom-android-certificates
          test -s /tmp/shalom-android-certificates/SHALOM-Android-v0.4.8.apk
          test -s /tmp/shalom-android-certificates/SHALOM-Android-v0.4.10.apk
      - name: Compare official Android package and versionCode history
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          cd /tmp/shalom-android-certificates
          "$AAPT" dump badging SHALOM-Android-v0.4.8.apk | grep '^package: ' > pkg048.txt
          "$AAPT" dump badging SHALOM-Android-v0.4.10.apk | grep '^package: ' > pkg0410.txt
          PKG_048=$(sed -n "s/.*name='\([^']*\)'.*/\1/p" pkg048.txt)
          PKG_0410=$(sed -n "s/.*name='\([^']*\)'.*/\1/p" pkg0410.txt)
          CODE_048=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" pkg048.txt)
          CODE_0410=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" pkg0410.txt)
          echo "0.4.8 paquete: $PKG_048 · versionCode: $CODE_048"
          echo "0.4.10 paquete: $PKG_0410 · versionCode: $CODE_0410"
          if [ "$PKG_048" != "com.shalomcoroacordes.cancionero" ] ||
             [ "$PKG_0410" != "$PKG_048" ]; then
            echo "::error::El paquete Android ha cambiado entre versiones oficiales."
            exit 1
          fi
          if ! [[ "$CODE_048" =~ ^[0-9]+$ && "$CODE_0410" =~ ^[0-9]+$ ]]; then
            echo "::error::versionCode inválido en una APK histórica."
            exit 1
          fi
          if (( 10#$CODE_048 >= 10#$CODE_0410 || 10#$CODE_0410 != 33 )); then
            echo "::error::El historial versionCode no permite la actualización esperada."
            exit 1
          fi
          echo "Identidad de paquete y progresión de versionCode: compatibles."

      - name: Compare actual signing certificates used in v0.4.8 and v0.4.10
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$SIGNER"
          cd /tmp/shalom-android-certificates
          "$SIGNER" verify --print-certs SHALOM-Android-v0.4.8.apk > v048.txt
          "$SIGNER" verify --print-certs SHALOM-Android-v0.4.10.apk > v0410.txt
          SHA_048=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' v048.txt | head -1)
          SHA_0410=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' v0410.txt | head -1)
          test -n "$SHA_048"
          test -n "$SHA_0410"
          echo "v0.4.8 signer SHA-256: $SHA_048"
          echo "v0.4.10 signer SHA-256: $SHA_0410"
          if [ "$SHA_048" != "$SHA_0410" ]; then
            echo "::error::Las APK oficiales v0.4.8 y v0.4.10 tienen firmas distintas. Una instalación no puede actualizarse sobre la otra normalmente."
            exit 1
          fi
          echo "Historial de certificados 0.4.8 y 0.4.10: compatible."
