name: Publicar APK SHALOM para Android
on:
  push:
    paths:
      - ".github/workflows/publish-android-apk.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar APK generado y verificado
        uses: actions/download-artifact@v4
        with:
          name: SHALOM-Android-APK
          path: apk
          run-id: 43674008302
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Preparar archivo descargable
        run: |
          test -s apk/app-release.apk
          mv apk/app-release.apk apk/SHALOM-Android.apk
          ls -lh apk/SHALOM-Android.apk
          sha256sum apk/SHALOM-Android.apk
      - name: Publicar versión de prueba descargable directamente desde el teléfono
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.0-android-test apk/SHALOM-Android.apk \
            --target "$GITHUB_SHA" \
            --title "SHALOM Android - versión de prueba 0.1.0" \
            --prerelease \
            --notes "Aplicación nativa de SHALOM para Android con cantos en SQLite. Descarga de prueba: instalar bajo responsabilidad propia, verificar canto y modo avión. No se requiere Expo Go. Esta versión aún necesita pruebas en dispositivos físicos."
