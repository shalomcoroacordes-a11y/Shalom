name: SHALOM Native Check
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/native-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React Native and Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo SDK compatibility
        run: npx expo install --check
      - name: Validate JavaScript syntax of all native screens
        run: |
          node --check App.js
          node --check src/song-actions-core.js
          node --check src/song-actions-ui.js
          node --check src/song-print.js
          node --check src/personal-ui.js
          node --check src/personal-collections.js
          node --check src/profile-ui.js
          node --check src/personal-backup-core.js
          node --check src/personal-backup-io.js
          node --check src/personal-backup-ui.js
          node --check src/local-notice.js
          node --check src/profile-options-menu.js
      - name: Test lyrics, folders, videos and correction forms
        run: |
          node tests/chords.test.js
          node tests/favorites.test.js
          node tests/repertoire-ui.test.js
          node tests/catalog.test.js
          node tests/requests.test.js
          node tests/medleys.test.js
          node tests/personal-collections.test.js
          node tests/personal-cover-ui.test.js
          node tests/local-profile.test.js
          node tests/song-actions.test.js
          node tests/personal-backup.test.js
