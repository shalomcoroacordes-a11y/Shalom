name: SHALOM Native Check
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/native-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-node22-mobile-${{ hashFiles('mobile/package.json', 'mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-node22-mobile-
      - name: Install React Native and Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo SDK compatibility
        run: npx expo install --check
      - name: Check JavaScript syntax across Android modules
        run: npm run test:syntax
      - name: Run every Android regression test
        run: npm test
