name: SHALOM Android Preview (instalación paralela)
on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-preview.yml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
# Only one expensive Gradle preview build per PR/branch.
concurrency:
  group: shalom-android-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo compatibility and native unit tests
        run: |
          npx expo install --check
          npm run test:syntax
          npm test
      - name: Generate official SHALOM dove icons for preview
        run: |
          python3 -m venv /tmp/shalom-preview-icons
          /tmp/shalom-preview-icons/bin/pip install --disable-pip-version-check --quiet cairosvg
          /tmp/shalom-preview-icons/bin/python scripts/generate_icons.py
          test -s assets/icon.png
      - name: Check current SHALOM identity before creating isolated preview
        run: node scripts/release-preflight.js
      - name: Give the preview its own Android package and title
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const file='app.json';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.expo.name='SHALOM Pruebas';
          config.expo.slug='shalom-offline-preview';
          config.expo.android.package='com.shalomcoroacordes.cancionero.preview';
          config.expo.ios.bundleIdentifier='com.shalomcoroacordes.cancionero.preview';
          fs.writeFileSync(file,JSON.stringify(config,null,2)+'\n');
          if(config.expo.android.package==='com.shalomcoroacordes.cancionero')
            throw new Error('La APK de prueba nunca debe reemplazar la aplicación real');
          NODE
      - name: Generate isolated Android preview project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Compile standalone Android preview APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Verify preview APK signature, identity, architectures and digest
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/preview-badging.txt"
          grep -F "package: name='com.shalomcoroacordes.cancionero.preview'" "$RUNNER_TEMP/preview-badging.txt"
          grep -F "'arm64-v8a'" "$RUNNER_TEMP/preview-badging.txt"
          grep -F "'x86_64'" "$RUNNER_TEMP/preview-badging.txt"
          sha256sum "$APK"
      - name: Upload isolated preview APK (no Release)
        uses: actions/upload-artifact@v4
        with:
          name: SHALOM-Preview-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  smoke-install:
    needs: preview-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SHALOM-Preview-${{ github.sha }}
          path: apk
      - name: Check hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install and launch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-linux-hw-accel: false
          script: >-
            bash -lc 'set -e; PKG=com.shalomcoroacordes.cancionero.preview;
            adb install apk/app-release.apk;
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1;
            sleep 18; adb shell pidof "$PKG" || { adb logcat -d -v brief -s AndroidRuntime:E ReactNativeJS:E ReactNative:E | tail -n 140; exit 1; };
            adb exec-out screencap -p > /tmp/shalom-preview-launch.png; test -s /tmp/shalom-preview-launch.png'
      - name: Keep installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHALOM-PREVIEW-INSTALL-SMOKE
          path: /tmp/shalom-preview-launch.png
          if-no-files-found: warn
          retention-days: 14
