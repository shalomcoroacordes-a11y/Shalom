name: SHALOM Admin Android — validate, smoke and prerelease
on:
  push:
    branches: [main, "feature/shalom-admin-android-v1"]
    paths:
      - "admin-mobile/**"
      - "sql/SHALOM_ADMIN_ROLES_20261121.sql"
      - "sql/SHALOM_ADMIN_HARDENING_20261121.sql"
      - ".github/workflows/admin-apk.yml"
  pull_request:
    paths:
      - "admin-mobile/**"
      - "sql/SHALOM_ADMIN_ROLES_20261121.sql"
      - "sql/SHALOM_ADMIN_HARDENING_20261121.sql"
      - ".github/workflows/admin-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shalom-admin-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo compatibility
        run: npx expo install --check
      - name: Check JavaScript syntax
        run: npm run test:syntax
      - name: Test content model, authentication and permissions
        run: npm test
  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: admin-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate original SHALOM dove icon
        run: |
          python3 -m venv /tmp/shalom-admin-icons
          /tmp/shalom-admin-icons/bin/pip install --quiet cairosvg
          /tmp/shalom-admin-icons/bin/python ../mobile/scripts/generate_icons.py
          mkdir -p assets
          cp ../mobile/assets/icon.png assets/icon.png
          cp ../mobile/assets/adaptive-foreground.png assets/adaptive-foreground.png
          test -s assets/icon.png
      - name: Isolate non-production Admin package
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          node -e 'const fs=require("fs"),p="app.json",c=JSON.parse(fs.readFileSync(p));c.expo.android.package="com.shalomcoroacordes.admin.preview";c.expo.name="SHALOM Admin Preview";c.expo.scheme="shalomadminpreview";fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build SHALOM Admin APK
        working-directory: admin-mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK and checksum
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          EXPECTED=com.shalomcoroacordes.admin.preview
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then EXPECTED=com.shalomcoroacordes.admin; fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -F "package: name='$EXPECTED'"
      - name: Verify official Admin upgrade identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download admin-v0.1.2 --pattern "SHALOM-Admin-v0.1.2.apk" --dir "$RUNNER_TEMP/admin-baseline"
          OLD="$RUNNER_TEMP/admin-baseline/SHALOM-Admin-v0.1.2.apk"
          NEW=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          certificate(){ "$SIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1; }
          OLD_SHA=$(certificate "$OLD"); NEW_SHA=$(certificate "$NEW")
          test -n "$OLD_SHA" && test "$OLD_SHA" = "$NEW_SHA"
          "$AAPT" dump badging "$OLD" | grep -F "package: name='com.shalomcoroacordes.admin' versionCode='3'"
          "$AAPT" dump badging "$NEW" | grep -F "package: name='com.shalomcoroacordes.admin' versionCode='4'"
      - name: Upload SHALOM Admin isolated APK
        uses: actions/upload-artifact@v4
        with:
          name: SHALOM-ADMIN-Android-Preview
          path: admin-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SHALOM-ADMIN-Android-Preview
          path: apk
      - name: Check download
        run: |
          test -s apk/app-release.apk
          sha256sum apk/app-release.apk
      - name: Check hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Boot Android and check login screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-linux-hw-accel: false
          script: >-
            bash -lc 'set -e; PKG=com.shalomcoroacordes.admin.preview; if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then PKG=com.shalomcoroacordes.admin; fi; adb install apk/app-release.apk; adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1;
            sleep 18; adb shell pidof "$PKG" || { echo "La app se cerró tras abrir";
            adb logcat -d -v brief -s AndroidRuntime:E ReactNativeJS:E ReactNative:E | tail -n 140; exit 1; };
            adb exec-out screencap -p > /tmp/shalom-admin-login.png; test -s /tmp/shalom-admin-login.png'
      - name: Keep Android launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHALOM-ADMIN-LOGIN-SMOKE
          path: /tmp/shalom-admin-login.png
          if-no-files-found: warn
          retention-days: 14
  publish-official:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, apk, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SHALOM-ADMIN-Android-Preview
          path: apk
      - name: Publish official SHALOM Admin only after smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./admin-mobile/package.json').version")
          TAG="admin-v$VERSION"
          FILE="SHALOM-Admin-v$VERSION.apk"
          test -s apk/app-release.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::El tag $TAG ya existe. No sobrescribir APK firmada."
            exit 1
          fi
          cp apk/app-release.apk "$FILE"
          gh release create "$TAG" "$FILE" \
            --title "SHALOM Admin $VERSION" \
            --notes "Versión oficial independiente de SHALOM público. Studio con edición independiente por secciones, copia completa, letra y acordes por compás, subdivisiones y reproductor compacto. Acceso con cuenta autorizada. Firma y arranque Android verificados."
